name: Security Checks

# Rungs 2, 5, 6 and the lint gate from deploy/SECURITY-TESTING.md.
# All four are free and deterministic, so unlike the Strix scan they are safe
# to run on every push and every pull request. The three lint/secret jobs
# finish in seconds; the trivy job builds both images first, so expect a few
# minutes for that one. All four run in parallel.
#
# This workflow does NOT touch deploy.yml. It runs alongside it.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # Image CVEs appear without anyone touching this repository: a vulnerability
  # disclosed against node:22-alpine or mysql:8.4 makes yesterday's build
  # unsafe today. Code-triggered runs would never notice. This one does.
  schedule:
    - cron: '0 4 * * 1'          # Mondays 04:00 UTC

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # --- Rung 2: secrets in git history -------------------------------------
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks walks the commit history, not the working tree. The
          # default shallow checkout would hide every leak older than the
          # last commit — which is precisely the kind this repo has had.
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan history
        run: |
          # `git` is the history-scanning subcommand. (`detect` was removed in
          # gitleaks v8.30 — it does not exist any more.)
          #
          # --redact is not optional here: this repository is PUBLIC, and build
          # logs are public with it. Without it a scan that finds a secret
          # republishes that secret to anyone reading the log.
          gitleaks git . \
            --redact \
            --verbose \
            --report-format sarif \
            --report-path gitleaks.sarif

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          retention-days: 30
          if-no-files-found: ignore

  # --- Rung 6: Dockerfile linting -----------------------------------------
  dockerfiles:
    name: Dockerfile lint (hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml
          # Fail on `error` only. `warning` and below are reported in the log
          # but do not break the build, so the first run gives you a baseline
          # to triage rather than an immediate red pipeline.
          failure-threshold: error

      - name: Lint docker/mysql.Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: docker/mysql.Dockerfile
          config: .hadolint.yaml
          failure-threshold: error

  # --- Rung 5: CVEs in the images we actually ship -------------------------
  images:
    name: Image CVE scan (trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Both images are built here rather than pulled, because both are ours:
      # the app image, and the MySQL image with schema.sql baked in. Scanning
      # the bare mysql:8.4 instead would miss anything our own layer adds.
      #
      # Caveat worth knowing: this scans what CI builds *now*. Because the base
      # tags float, it is not byte-identical to the image currently running on
      # EC2 — it is the image the next deploy would produce. That is the useful
      # question ("is my next deploy clean?"), but it is not the same question
      # as "is the running container clean?".
      - name: Build app image
        run: docker build -t crud-app:ci .

      - name: Build database image
        run: docker build -f docker/mysql.Dockerfile -t crud-db:ci .

      - name: Scan app image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: crud-app:ci
          # Finds CVEs in BOTH the Alpine OS packages and the npm packages
          # installed inside the image — one scan covers both layers.
          vuln-type: os,library
          severity: CRITICAL,HIGH
          # Hide CVEs with no released fix. They are real, but there is no
          # action to take beyond rebuilding later, and they drown the ones
          # you can act on today. Set to false to see the full picture.
          ignore-unfixed: true
          # Report, do not fail — same baseline-first approach as hadolint.
          # Switch to '1' once the findings are triaged.
          exit-code: '0'
          format: table

      - name: Scan database image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: crud-db:ci
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'
          format: table

  # --- Infrastructure-as-code misconfiguration scanning --------------------
  terraform:
    name: Terraform scan (trivy config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # NOT tfsec. Aqua folded tfsec into Trivy — its final release was
      # v1.28.14 in May 2025 and it receives no new rules. `trivy config` runs
      # the same 1,000+ checks, and we already run Trivy for image CVEs, so
      # this adds a scanner we are not otherwise maintaining.
      - name: Scan Terraform config
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: infra/
          severity: CRITICAL,HIGH,MEDIUM
          # Report-only until the findings are triaged — same approach as the
          # image scan and hadolint.
          exit-code: '0'
          format: table

  # --- JavaScript linting --------------------------------------------------
  lint:
    name: JavaScript lint (eslint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      # `npm ci` installs devDependencies too, which is what we want here —
      # eslint lives in devDependencies. The production image still builds with
      # `npm ci --omit=dev`, so none of this reaches the shipped container.
      - run: npm ci

      - run: npm run lint
