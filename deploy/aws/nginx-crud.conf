# Nginx site config for the CRUD app on EC2.
# Nginx terminates HTTP on :80 and reverse-proxies to Node on 127.0.0.1:3000,
# the same shape as the Apache vhost used locally.
#
# Installed to /etc/nginx/sites-available/crud by provision.sh

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Responds on the instance's public IP. Replace with a real hostname
    # (e.g. crud.example.com) when you add a domain.
    server_name _;

    # Don't advertise the nginx version in error pages and headers.
    server_tokens off;

    access_log /var/log/nginx/crud_access.log;
    error_log  /var/log/nginx/crud_error.log;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_min_length 512;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Pass the real client details through to Express, which is
        # configured with `app.set('trust proxy', 'loopback')`.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Needed if websockets are ever added.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }
}
