# Apache virtual host for the Node.js CRUD app.
# Apache cannot execute Node directly, so it acts as a reverse proxy:
# browser -> Apache :80 (crud.local) -> Node/Express :3000
#
# Install:
#   sudo cp /var/www/your_domain/crud/deploy/crud.local.conf /etc/apache2/sites-available/
#   sudo a2enmod proxy proxy_http headers
#   sudo a2ensite crud.local
#   sudo apache2ctl configtest && sudo systemctl reload apache2

<VirtualHost *:80>
    ServerName crud.local

    ProxyPreserveHost On
    ProxyRequests Off

    ProxyPass        / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    # Pass the real client IP and scheme through to Express.
    RequestHeader set X-Forwarded-Proto "http"

    ErrorLog  ${APACHE_LOG_DIR}/crud_error.log
    CustomLog ${APACHE_LOG_DIR}/crud_access.log combined
</VirtualHost>
