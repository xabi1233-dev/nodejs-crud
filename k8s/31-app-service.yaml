# ClusterIP: reachable inside the cluster only. Traefik is the single public
# entry point, exactly as nginx is the only public entry point on the EC2 box.
# Nothing here publishes a host port.
apiVersion: v1
kind: Service
metadata:
  name: crud-app
  namespace: crud
  labels:
    app: crud-app
spec:
  type: ClusterIP
  selector:
    app: crud-app       # matches the Deployment's pod labels
  ports:
    - name: http
      port: 3000        # the port 40-ingress.yaml targets
      targetPort: http  # the container's named port
